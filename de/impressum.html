    .container { max-width: 850px; margin: 3.5rem auto; padding: 0 1.5rem; }
    h1 { font-size: 2.2rem; color: #fff; margin-bottom: 1.5rem; }
    h2 { font-size: 1.3rem; color: #fff; margin: 1.5rem 0 0.5rem; }
    p, address { color: var(--text-muted); font-style: normal; margin-bottom: 1rem; font-size: 0.95rem; }
    footer { text-align: center; padding: 3rem 0; border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.85rem; margin-top: 4rem; }
